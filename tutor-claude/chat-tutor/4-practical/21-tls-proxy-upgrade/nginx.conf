# ─────────────────────────────────────────────────────────────────────────────
# 21·23장 참고용 nginx 설정 — ⚠ 이 저장소에서 실제 nginx 로 실행 검증하지 않았다 (작성 환경에 nginx 미설치).
# 같은 동작(Upgrade 전달, idle timeout, 라운드로빈)은 proxy-demo.ts 로 직접 확인할 수 있다.
# 실행 예: nginx -c $(pwd)/4-practical/21-tls-proxy-upgrade/nginx.conf
# ─────────────────────────────────────────────────────────────────────────────
events {}

http {
  # Connection 헤더 값을 Upgrade 여부에 따라 정한다 (WebSocket 이면 "upgrade", 아니면 "close")
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream chat_servers {
    # 23장: 서버 여러 대. 기본은 라운드로빈.
    # ip_hash;   # sticky session 이 필요하면 (같은 IP → 같은 서버). 이 프로젝트는 Hazelcast 로 공유하므로 불필요
    server 127.0.0.1:8081 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:8082 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 8443 ssl;
    server_name localhost;

    # TLS 종료(termination): 브라우저 ↔ nginx 는 HTTPS/WSS, nginx ↔ Spring 은 평문 HTTP/WS (내부망)
    # 개발용 인증서 만들기: mkcert localhost  (또는 openssl req -x509 ...)
    ssl_certificate     /path/to/localhost.pem;
    ssl_certificate_key /path/to/localhost-key.pem;

    location /ws {
      proxy_pass http://chat_servers;
      proxy_http_version 1.1;                         # Upgrade 는 HTTP/1.1 기능
      proxy_set_header Upgrade $http_upgrade;         # ★ hop-by-hop 헤더라 명시적으로 넘겨야 한다
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;     # Spring 이 "원래는 https 였다"를 알 수 있게
      proxy_read_timeout 75s;                          # ★ STOMP heartbeat(10s)보다 충분히 길게. 기본 60s
      proxy_send_timeout 75s;
    }

    location /api/ {
      proxy_pass http://chat_servers;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /internal/** 은 외부에 노출하지 않는다 (고객사 서버는 별도 사설 경로·IP 허용 목록으로)
    location /internal/ { return 404; }
  }
}
