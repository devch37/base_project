<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!--
    CSP(22장): 이 콘솔에서 실행될 수 있는 스크립트는 "우리 출처(self)"의 파일뿐.
    복제 iframe(about:blank)은 이 CSP 를 그대로 물려받는다 → 혹시 소독을 뚫은 인라인 스크립트가 있어도 실행 불가.
    이미지·CSS 는 고객사 사이트 것을 받아야 하므로 넓게 연다 (트레이드오프: 상담사 IP 가 고객사 서버 로그에 남는다).
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' http: https:; img-src * data: blob:; font-src * data:; connect-src 'self' ws: wss: http://localhost:*; frame-src 'self' about:; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>상담사 콘솔</title>
  <link rel="stylesheet" href="/shared/ui.css" />
  <style>
    main { grid-template-columns: 260px 1fr 300px; align-items: start; }
    @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
    #rooms li { list-style: none; padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; }
    #rooms { padding: 0; margin: 0; }
    #stage { position: relative; overflow: hidden; background: repeating-linear-gradient(45deg,#f3f4f6,#f3f4f6 10px,#eceef1 10px,#eceef1 20px); border-radius: 8px; min-height: 300px; }
    #scaler { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
    #mirror { border: 0; background: #fff; display: block; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
    #overlay { position: absolute; left: 0; top: 0; pointer-events: none; }
    #chat { height: 260px; overflow: auto; background: #f6f7f9; border-radius: 6px; padding: 8px; }
    #url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
  </style>
</head>
<body>
  <header class="top">
    <h1>상담사 콘솔</h1>
    <label>상담사 ID <input id="agent-id" value="agent-1" style="width:100px" /></label>
    <span id="state" class="badge">대기</span>
    <span id="consent" class="badge">원격 조작: 꺼짐</span>
  </header>
  <main>
    <section class="panel">
      <h2>상담 대기열 <button id="refresh" style="float:right">새로고침</button></h2>
      <ul id="rooms"><li class="muted">방 목록을 불러오는 중…</li></ul>
    </section>

    <section class="panel">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <span>고객 화면: <span id="url" class="mono muted">-</span></span>
        <span class="row">
          <button id="resync" disabled>화면 다시 받기</button>
          <button id="close" class="danger" disabled>상담 종료</button>
          <button id="leave" disabled>나가기</button>
        </span>
      </div>
      <div id="stage">
        <div id="scaler">
          <!-- sandbox: allow-scripts 가 없으므로 이 안에서는 어떤 스크립트도 실행되지 않는다 (16·22장) -->
          <iframe id="mirror" sandbox="allow-same-origin" title="고객 화면"></iframe>
          <canvas id="overlay"></canvas>
        </div>
      </div>
      <p class="muted">클릭: 원격 조작 허용 시 고객 화면 클릭 / 미허용 시 "가리키기". Shift+클릭: 항상 가리키기.</p>
      <div class="stats" id="stats"></div>
    </section>

    <section class="panel">
      <h2>채팅</h2>
      <div id="chat"></div>
      <div class="row" style="margin-top:8px"><input id="text" placeholder="메시지" style="flex:1" /><button id="send" disabled>전송</button></div>
      <h2 style="margin-top:14px">이벤트 로그</h2>
      <div id="log" class="log" style="height:200px"></div>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
