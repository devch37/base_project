<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>17 에코 루프</title>
  <link rel="stylesheet" href="/shared/ui.css" />
  <style>
    .pane { height: 260px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: #fff; }
    .pane p { margin: 0 0 18px; }
  </style>
</head>
<body>
  <header class="top"><h1>17 · 이벤트가 양쪽에서 반복 전송되는 문제</h1><span class="muted">서버 불필요 — 지연 있는 가짜 네트워크로 두 화면을 양방향 동기화</span></header>
  <main>
    <section class="panel">
      <div class="row">
        <label>보호 방식
          <select id="mode">
            <option value="none">보호 없음 (그대로 되돌려 보냄)</option>
            <option value="guard" selected>EchoGuard (방금 적용한 값이면 무시)</option>
          </select>
        </label>
        <label>네트워크 지연 <input id="delay" type="number" value="120" style="width:60px" />ms</label>
        <span id="rate" class="badge">0 msg/s</span>
      </div>
      <p class="muted">"보호 없음"으로 두고 A 를 휠로 빠르게 스크롤해 보자. 지연 때문에 B 가 옛 위치를 되돌려 보내고, A 가 다시 끌려가며 덜덜 떨린다. 메시지 수도 폭증한다.</p>
    </section>
    <div class="grid2">
      <section class="panel"><h2>A (고객)</h2><div class="pane" id="a"></div>
        <h2 style="margin-top:10px">입력 동기화</h2><input id="ia" placeholder="A 에 입력" style="width:100%" /></section>
      <section class="panel"><h2>B (상담사)</h2><div class="pane" id="b"></div>
        <h2 style="margin-top:10px">입력 동기화</h2><input id="ib" placeholder="B 에 입력" style="width:100%" /></section>
    </div>
    <section class="panel"><div id="log" class="log" style="height:160px"></div></section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
