<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>원본 페이지</title>
  <link rel="stylesheet" href="./playground.css" />
</head>
<body>
  <h3>원본(고객) 페이지</h3>
  <div class="row">
    <button id="add">항목 추가</button>
    <button id="remove">마지막 삭제</button>
    <button id="color">색 바꾸기</button>
    <button id="move">첫 항목을 맨 뒤로</button>
    <button id="many">100개 한꺼번에</button>
  </div>
  <ul id="list"><li>사과</li><li>배</li></ul>
  <p><input id="name" placeholder="이름 입력" /> <input id="pw" type="password" placeholder="비밀번호" /></p>
  <p data-cobrowse-mask>마스킹되는 문단: 010-1234-5678</p>
  <div class="scroll" id="box">스크롤 영역<br />1<br />2<br />3<br />4<br />5<br />6<br />7<br />8<br />9<br />10<br />11<br />12<br />끝</div>
  <img src="../../apps/customer/assets/logo.svg" alt="상대 경로 이미지" />
  <script type="module" src="./playground.ts"></script>
</body>
</html>
