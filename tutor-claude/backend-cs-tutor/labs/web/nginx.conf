# Part 4.14 / 8.8 — 리버스 프록시 + 업스트림 실습용. lab에서 필요 시 확장.
events { worker_connections 1024; }

http {
    upstream app {
        server host.docker.internal:8081;
        # server host.docker.internal:8082;   # 인스턴스 추가해 LB 관찰
        keepalive 32;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Request-Id $request_id;   # Correlation ID 실습 (Part 15)
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location = /nginx_status {
            stub_status;   # active connections 관찰
        }
    }
}
