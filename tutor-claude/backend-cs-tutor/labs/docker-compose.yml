# backend-cs-tutor 실습 스택
#   docker compose up -d                 # 전체
#   docker compose up -d postgres redis   # 필요한 것만
#   docker compose exec toolbox bash      # 리눅스 도구 셸 (strace, ss, tcpdump, dig, ...)
#
# 각 모듈 lab.md 에서 필요한 서비스만 골라 사용.

name: bcs-tutor

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    command:
      - "postgres"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "log_min_duration_statement=200"   # 200ms 이상 쿼리 로깅 (slow query 랩)
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "max_connections=50"               # 커넥션 고갈 랩용으로 일부러 낮게
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  # 커넥션 풀 실습용 (Part 5.16)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
    ports: ["6432:6432"]
    depends_on: [postgres]

  redis:
    image: redis:7
    ports: ["6379:6379"]
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]

  # KRaft 모드 (ZooKeeper 없음) — Part 12
  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on: [kafka]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    depends_on: [prometheus]

  # Nginx 리버스 프록시 실습 (Part 4.14, 8.8)
  nginx:
    image: nginx:1.27
    ports: ["8080:80"]
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
    profiles: ["web"]   # docker compose --profile web up 으로만 기동

  # 리눅스 관찰 도구 셸 — strace, ss, tcpdump, dig, lsof, htop, perf 등
  toolbox:
    image: nicolaka/netshoot:latest
    command: ["sleep", "infinity"]
    cap_add: ["NET_ADMIN", "SYS_PTRACE"]
    network_mode: "host"
    pid: "host"          # 호스트 프로세스를 관찰 (strace -p, ss 등)

volumes:
  pgdata:
