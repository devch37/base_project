<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2·3단계 · STOMP 채팅</title>
  <link rel="stylesheet" href="/style.css" />
  <!-- STOMP 클라이언트 라이브러리. 전역 변수 StompJs 를 만든다 -->
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.3.0/bundles/stomp.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>STOMP 채팅</h1>
    <span id="server" class="badge">-</span>
    <span id="state" class="badge">연결 안 됨</span>
    <a href="/">처음으로</a>
  </header>
  <main>
    <section class="panel">
      <div class="row">
        <label>이름 <input id="name" value="철수" style="width:80px" /></label>
        <label>방 <input id="room" value="lobby" style="width:80px" /></label>
        <button id="connect" class="primary">연결 + 입장</button>
        <button id="disconnect">나가기</button>
      </div>
      <div id="messages"></div>
      <div class="row" style="margin-top:8px"><input id="text" placeholder="메시지" style="flex:1" /><button id="send">보내기</button></div>
      <div class="row"><button id="echo">@SendTo 에코 시험 (/app/echo)</button></div>
      <p class="hint">
        · 같은 방 이름의 탭끼리만 대화가 오간다 (방 = <code>/topic/rooms/{방}</code> 구독).<br />
        · 메시지 옆 <b>(서버 nnnn 이 받음)</b> = 그 메시지를 처음 받은 서버. 3단계에서 서버 2대를 띄우면 다른 서버 번호가 섞여 보인다.<br />
        · 오른쪽 로그에서 CONNECT / SUBSCRIBE / SEND / MESSAGE 프레임 원문을 보자.
      </p>
    </section>
    <section class="panel"><h2>STOMP 프레임 로그</h2><div id="log" class="log"></div></section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const log = (cls, text) => {
      const d = document.createElement('div');
      d.className = cls;
      d.textContent = text;
      $('log').appendChild(d);
      $('log').scrollTop = 1e9;
    };
    const show = (m) => {
      const d = document.createElement('div');
      // textContent 로 넣는다 — 남이 보낸 문자열을 innerHTML 에 넣으면 스크립트가 실행될 수 있다(XSS)
      d.textContent = `${m.sender}: ${m.text}  `;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = `(서버 ${m.receivedBy} 이 받음 · ${new Date(m.sentAt).toLocaleTimeString()})`;
      d.appendChild(meta);
      $('messages').appendChild(d);
      $('messages').scrollTop = 1e9;
    };

    fetch('/api/info').then((r) => r.json()).then((i) =>
      ($('server').textContent = `접속 서버 ${i.port} · Hazelcast ${i.hazelcast ? `멤버 ${i.clusterMembers}` : '꺼짐'}`));

    let client = null;

    $('connect').onclick = () => {
      client?.deactivate();
      $('messages').replaceChildren();
      const room = $('room').value.trim();

      client = new StompJs.Client({
        brokerURL: `ws://${location.host}/ws`,  // 이 페이지를 준 서버에 연결
        reconnectDelay: 3000,                    // 끊기면 3초 뒤 자동 재연결
        heartbeatIncoming: 10000,                // "10초마다 살아 있다는 신호 주고받자"
        heartbeatOutgoing: 10000,
        // stompjs 가 주고받는 프레임을 그대로 보여 준다 (>>> 보냄, <<< 받음)
        debug: (msg) => /^(>>>|<<<)/.test(msg) && log(msg.startsWith('>>>') ? 'out' : 'in', msg),
      });

      client.onConnect = () => {
        $('state').textContent = '연결됨';
        $('state').className = 'badge ok';

        // ① 지난 대화: 구독하면 서버가 "나에게만" 한 번 답한다 (@SubscribeMapping)
        const once = client.subscribe(`/app/rooms/${room}/history`, (msg) => {
          JSON.parse(msg.body).forEach(show);
          once.unsubscribe();
        });
        // ② 실시간: 이 방의 새 메시지 (방송) — 재연결되면 onConnect 가 다시 불려 다시 구독한다
        client.subscribe(`/topic/rooms/${room}`, (msg) => show(JSON.parse(msg.body)));
        // ③ @SendTo 예제
        client.subscribe('/topic/echo', (msg) => log('sys', `[/topic/echo 수신] ${msg.body}`));
      };
      client.onWebSocketClose = () => {
        $('state').textContent = '끊김 (자동 재연결 시도 중)';
        $('state').className = 'badge';
      };
      client.activate();
    };

    $('disconnect').onclick = () => {
      client?.deactivate(); // DISCONNECT 프레임 → 정상 종료
      $('state').textContent = '연결 안 됨';
      $('state').className = 'badge';
    };

    const send = () => {
      if (!client?.connected) return;
      client.publish({
        destination: `/app/rooms/${$('room').value.trim()}/send`, // /app → 컨트롤러가 먼저 받는다
        body: JSON.stringify({ sender: $('name').value, text: $('text').value }),
      });
      $('text').value = '';
    };
    $('send').onclick = send;
    $('text').onkeydown = (e) => e.key === 'Enter' && send();
    $('echo').onclick = () => client?.connected && client.publish({ destination: '/app/echo', body: '안녕' });
  </script>
</body>
</html>
