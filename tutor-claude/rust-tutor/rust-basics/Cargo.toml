# =============================================================================
# Cargo.toml = Java의 pom.xml / build.gradle 에 해당하는 파일
# =============================================================================
# - [package]      : 프로젝트 이름, 버전, 에디션(언어 버전) 정보
# - [dependencies] : 외부 라이브러리(Rust에서는 "크레이트(crate)"라고 부름)
#
# 이 프로젝트는 src/bin/ 아래의 파일 하나하나가 "실행 가능한 프로그램"입니다.
# (Java로 치면 main 메서드를 가진 클래스가 여러 개 있는 것과 비슷합니다)
#
#   cargo run --bin ch01_variables_types     ← 챕터 1 실행
#   cargo test --bin ex01_basics             ← 연습문제 1 채점
# =============================================================================

[package]
name = "rust-basics"
version = "0.1.0"
edition = "2021"   # actix-web-tutorial 과 같은 에디션으로 맞춤

[dependencies]
# serde: Rust 구조체 <-> JSON 변환 라이브러리 (Java의 Jackson 역할)
#        features = ["derive"] 를 켜야 #[derive(Serialize, Deserialize)] 를 쓸 수 있습니다.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio: 비동기(async) 런타임. actix-web 내부에서도 tokio 를 사용합니다.
#        ch13_async_await 챕터에서 사용합니다.
tokio = { version = "1", features = ["full"] }
